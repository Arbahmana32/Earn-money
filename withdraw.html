<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سحب الأرباح 💸</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <a href="index.html" class="logo">🎡 عجلة الحظ الكبرى</a>
            <div class="bal-box"><span id="userBal">0</span> نقطة</div>
        </div>

        <div class="card">
            <h3 style="color:#00ffcc; margin-bottom:10px;">📋 بيانات سحب الأرباح</h3>
            <p style="font-size: 12px; color: #ccc; margin-bottom: 15px;">أدخل بياناتك بدقة ليتم تحويل المبلغ لبطاقتك في شام كاش:</p>

            <form id="withdrawForm">
                <div class="form-group">
                    <label>👤 الاسم الكامل:</label>
                    <input type="text" id="wName" class="form-control" required placeholder="أدخل اسمك كما هو بالمحفظة">
                </div>
                <div class="form-group">
                    <label>📱 الرقم / رقم المحفظة:</label>
                    <input type="tel" id="wPhone" class="form-control" required placeholder="أدخل رقمك في شام كاش">
                </div>
                <div class="form-group">
                    <label>💰 المبلغ المراد سحبه ($):</label>
                    <input type="number" id="wAmount" class="form-control" required placeholder="مثال: 150">
                </div>
                <div class="form-group">
                    <label>🖼️ صورة باركود الشام كاش لتحويل الهدية:</label>
                    <input type="file" id="wBarcodeImg" accept="image/*" class="file-input" required>
                </div>

                <button type="submit" class="btn btn-withdraw" style="margin-top:10px;">تأكيد وإرسال طلب السحب 🚀</button>
                <a href="index.html" class="btn btn-back">⬅️ العودة للرئيسية</a>
            </form>
        </div>
    </div>

    <script>
        window.onload = function() {
            var balance = parseInt(localStorage.getItem("app_balance")) || 0;
            document.getElementById("userBal").innerText = balance.toLocaleString();

            document.getElementById("withdrawForm").onsubmit = function(e) {
                e.preventDefault();
                var fileInput = document.getElementById("wBarcodeImg");
                var file = fileInput.files[0];

                var reader = new FileReader();
                reader.onload = function(evt) {
                    var withdraws = JSON.parse(localStorage.getItem("app_withdraws")) || [];
                    var req = {
                        id: Date.now(),
                        name: document.getElementById("wName").value,
                        phone: document.getElementById("wPhone").value,
                        amount: document.getElementById("wAmount").value,
                        barcodeImg: evt.target.result,
                        status: "pending",
                        date: new Date().toLocaleString("ar-EG")
                    };
                    withdraws.push(req);
                    localStorage.setItem("app_withdraws", JSON.stringify(withdraws));

                    alert("تم إرسال طلب سحب الأرباح بنجاح! 💸\nالطلب الآن قيد المراجعة لدى الأدمن، وسيتم تحويل المبلغ لمحفظتك بعد التأكيد.");
                    window.location.href = "index.html";
                };

                if (file) {
                    reader.readAsDataURL(file);
                }
            };
        };
    </script>
</body>
</html>
