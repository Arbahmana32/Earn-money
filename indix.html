<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عجلة الحظ الكبرى 🎡</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header-bar">
            <a href="index.html" class="logo">🎡 عجلة الحظ الكبرى</a>
            <div class="bal-box"><span id="userBal">0</span> نقطة</div>
        </div>

        <!-- Main Card -->
        <div class="card">
            <a href="charge.html" class="btn btn-charge">⚡ شحن النقاط لشراء المحاولات</a>
            <a href="withdraw.html" class="btn btn-withdraw">💸 سحب الأرباح إلى شام كاش</a>

            <div class="wheel-wrapper">
                <div class="pointer"></div>
                <canvas id="wheelCanvas" width="280" height="280"></canvas>
            </div>

            <div style="font-size: 13px; color: #ccc;">تكلفة التدوير: <b style="color:#ffd700">5000 نقطة</b></div>
            <button class="spin-btn" id="spinBtn">تدوير العجلة 🚀</button>
            <div class="result-text" id="resText"></div>
        </div>
    </div>

    <script>
        window.onload = function() {
            var balance = parseInt(localStorage.getItem("app_balance")) || 0;

            function updateBalanceUI() {
                document.getElementById("userBal").innerText = balance.toLocaleString();
                localStorage.setItem("app_balance", balance);
            }
            updateBalanceUI();

            var sectors = [
                { label: "50,000 💎", value: 50000, color: "#e67e22" },
                { label: "حظ أوفر ❌", value: 0, color: "#e74c3c" },
                { label: "10,000 🏆", value: 10000, color: "#f1c40f" },
                { label: "2,500 نقطة", value: 2500, color: "#1abc9c" },
                { label: "مضاعفة 2x", value: "2x", color: "#2ecc71" },
                { label: "1,000 نقطة", value: 1000, color: "#3498db" },
                { label: "5,000 نقطة", value: 5000, color: "#34495e" },
                { label: "500 نقطة", value: 500, color: "#9b59b6" }
            ];

            var canvas = document.getElementById("wheelCanvas");
            var ctx = canvas.getContext("2d");
            var numSectors = sectors.length;
            var arc = (2 * Math.PI) / numSectors;
            var isSpinning = false;
            var currentRotation = 0;

            function initWheel() {
                ctx.clearRect(0, 0, 280, 280);
                for (var i = 0; i < numSectors; i++) {
                    var angle = i * arc;
                    ctx.beginPath();
                    ctx.fillStyle = sectors[i].color;
                    ctx.moveTo(140, 140);
                    ctx.arc(140, 140, 135, angle, angle + arc);
                    ctx.lineTo(140, 140);
                    ctx.fill();
                    ctx.strokeStyle = "#150328";
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    ctx.save();
                    ctx.translate(140, 140);
                    ctx.rotate(angle + arc / 2);
                    ctx.textAlign = "right";
                    ctx.fillStyle = "#fff";
                    ctx.font = "bold 11px system-ui";
                    ctx.fillText(sectors[i].label, 120, 4);
                    ctx.restore();
                }
            }
            initWheel();

            document.getElementById("spinBtn").onclick = function() {
                if (isSpinning) return;
                if (balance < 5000) {
                    alert("رصيدك غير كافٍ للتدوير! يرجى شحن الرصيد أولاً.");
                    return;
                }

                balance -= 5000;
                updateBalanceUI();
                document.getElementById("resText").innerText = "";
                isSpinning = true;
                this.disabled = true;

                var winningIndex = Math.floor(Math.random() * numSectors);
                var sectorDegree = 360 / numSectors;
                var targetSectorCenter = (winningIndex * sectorDegree) + (sectorDegree / 2);
                var offsetToTop = (270 - targetSectorCenter + 360) % 360;
                var extraSpins = (5 + Math.floor(Math.random() * 3)) * 360;
                var currentMod = currentRotation % 360;
                currentRotation += extraSpins + ((offsetToTop - currentMod + 360) % 360);

                canvas.style.transform = "rotate(" + currentRotation + "deg)";

                setTimeout(function() {
                    isSpinning = false;
                    document.getElementById("spinBtn").disabled = false;
                    var winSector = sectors[winningIndex];
                    var winMsg = "";

                    if (winSector.value === "2x") {
                        balance += 10000;
                        winMsg = "🎉 مضاعفة! ربحت 10,000 نقطة";
                    } else if (typeof winSector.value === "number" && winSector.value > 0) {
                        balance += winSector.value;
                        winMsg = "🎉 مبروك! ربحت " + winSector.value.toLocaleString() + " نقطة";
                    } else {
                        winMsg = "❌ حظ أوفر في المرة القادمة!";
                    }

                    updateBalanceUI();
                    var resDiv = document.getElementById("resText");
                    resDiv.innerText = winMsg;
                    resDiv.style.color = (winSector.value > 0 || winSector.value === "2x") ? "#00ffcc" : "#ff4757";
                }, 4000);
            };
        };
    </script>
</body>
</html>
